[INISystem]
BasedOn=GameLobbyBase.ini

[SkirmishLobby]
$BaseSection=GameLobbyBase

[GameOptionsPanel]
$CC-GODD03=cmbGameSpeedCapSkirmish:GameLobbyDropDown

[cmbGameSpeedCapSkirmish]
$BaseSection=cmbGameSpeedCap
; A skirmish waits FrameTimer.DelayTime 60Hz ticks a frame and Main_Loop sets that straight
; from GameSpeed, so the index here is literally the tick count: 0 ticks is uncapped, 1 is
; 60 FPS, 2 is 30, and so on. A networked session waits on milliseconds instead, which is
; why the multiplayer list reads 60,45,30,... for the same indices. Both are correct for
; their own session type. How fast a replay is watched is a separate choice, made in the
; replay window, and has nothing to do with either list.
Items=MAX,60 FPS,30 FPS,20 FPS,15 FPS,12 FPS,10 FPS
